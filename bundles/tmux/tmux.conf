# Tmux configuration file
# Copyright (C) 2026 choozn

# General Settings
set -sg escape-time 0
set -g history-limit 200000
set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -ga terminal-overrides ",*:Tc"
set -as terminal-overrides ',*:indn@'
set -g mouse on
set -g focus-events on
set -g detach-on-destroy off
set-option -g repeat-time 0
set -g mouse on
set -g bell-action none
set -g visual-bell on

# Binds
## Prefix & Reload
set-option -g prefix C-a
unbind-key C-a
bind-key C-a send-prefix
bind-key R source-file ~/.tmux.conf \; display-message "[TMUX] Configuration tmux.conf reloaded."

## Pane Navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

## Pane Resizing
unbind -n S-Left
unbind -n S-Right
unbind -n S-Up
unbind -n S-Down
bind-key -rn C-Left resize-pane -L 5
bind-key -rn C-Down resize-pane -D 5
bind-key -rn C-Up resize-pane -U 5
bind-key -rn C-Right resize-pane -R

## Vim-aware Pane Switching
bind -n C-h run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys C-l) || tmux select-pane -R"
bind -n 'C-\' run "(tmux display-message -p '#{pane_current_command}' | grep -iqE '(^|\/)vim$' && tmux send-keys 'C-\\') || tmux select-pane -l"
bind C-l send-keys 'C-l'

## Window & Session Management
bind-key a choose-tree -Zw
bind-key -n C-space split-window -v -c "#{pane_current_path}"
bind-key -n C-x kill-pane
bind-key x kill-pane
bind-key -n C-f resize-pane -Z
bind-key e last-pane
bind-key q display-panes
bind-key n new-session -A
bind-key space new-window
bind-key Tab next-window
bind-key BTab previous-window
bind-key -n C-o next-window
bind-key o next-window
bind-key O previous-window
bind-key d detach
bind-key C-d detach
bind-key -n C-p next-layout
bind-key p rotate-window
bind-key -n C-l send-keys C-l \; send-keys -R \; clear-history

## Copy & Paste
bind-key [ copy-mode
bind-key ] paste-buffer
bind-key : command-prompt

# Window Switching
bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9
bind-key 0 select-window -t 10

# Sesh
bind-key C-a display-popup -E -w 40% "sesh connect \"$(
 sesh list -i | gum filter --limit 1 --no-sort --fuzzy --placeholder 'Pick a session' --height 50 --prompt='⚡'
)\""

# VIM Input
setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# Window & Pane Settings
setw -g aggressive-resize on
setw -g window-style 'bg=default'
setw -g window-active-style 'bg=default'
set-window-option -g other-pane-height 25
set-window-option -g other-pane-width 80
set-window-option -g display-panes-time 1500
setw -g monitor-activity on
set -g visual-activity on

# Hooks
set-hook -g after-new-window "select-layout main-vertical"
set-hook -g after-split-window "select-layout main-vertical"

# Status Bar
set-option -g status-interval 1
set -g status-position bottom
set -g status-style 'bg=#13161d fg=#8b949e'
set -g status-left-length 20
set -g status-right-length 50
set -g status-left '#[fg=#00e68a,bold] #S #[fg=#30363d]│ '
set -g status-right '#[fg=#30363d]│#[fg=#8b949e] %H:%M #[fg=#30363d]│#[fg=#8b949e] %d-%b-%y '

# Window Status
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#00e68a,bold] #I:#W '

# Pane Borders
set-option -g pane-border-style 'fg=#30363d bg=default'
set-option -g pane-active-border-style 'fg=#00e68a bg=default'
set-option -g pane-active-border-style fg=yellow
set-option -g pane-border-style fg=cyan

# Message Styling
set -g message-style 'bg=#00e68a fg=#000000 bold'

# Mouse input
set -g @emulate-scroll-for-no-mouse-alternate-buffer on

# TMUX plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

run-shell "bash ~/.tmux/plugins/tpm/scripts/install_plugins.sh > /dev/null 2>&1"

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
