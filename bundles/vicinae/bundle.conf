# Header
title="Vicinae - Application Runner"
bundle_id="vicinae"

# Packages
packages=(
    "vicinae-bin"
)

# Config files
# Always specify the full path, not just the folder!
files=(
    "vicinae.json"  "$HOME/.config/vicinae/vicinae.json"
)

# Pre installation
pre() {
    true
}

# Pre linking
pre_link() {
    true
}

# Post installation
post() {
    true
}
